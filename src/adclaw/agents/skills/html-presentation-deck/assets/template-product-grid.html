<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Replace with deck title</title>
<style>
  :root {
    --paper: #f7f7f1;
    --ink: #090b0f;
    --muted: #59605a;
    --faint: #d8ded4;
    --panel: #ecefe6;
    --panel-2: #e1e8dc;
    --accent: #165cff;
    --accent-on: #ffffff;
    --yellow: #e8ef38;
    --orange: #ff6b22;
    --green: #62d44e;
    --sans: "Aptos", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --pad-x: 74px;
    --pad-y: 46px;
    --nav-safe: 44px;
  }

  * { box-sizing: border-box; }
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }
  body {
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  h1, h2, h3, p, blockquote { margin: 0; }
  img { max-width: 100%; }

  .deck {
    width: 100vw;
    height: 100vh;
    display: flex;
    transition: transform 420ms cubic-bezier(.22,.61,.36,1);
  }
  .slide {
    width: 100vw;
    height: 100vh;
    flex: 0 0 100vw;
    position: relative;
    overflow: hidden;
    padding: var(--pad-y) var(--pad-x);
    background: var(--paper);
    color: var(--ink);
  }
  .slide.theme-dark {
    background: var(--ink);
    color: var(--paper);
    --muted: rgba(247,247,241,.72);
    --faint: rgba(247,247,241,.18);
    --panel: rgba(247,247,241,.07);
    --panel-2: rgba(247,247,241,.13);
  }
  .slide.theme-accent {
    background: var(--accent);
    color: var(--accent-on);
    --muted: rgba(255,255,255,.76);
    --faint: rgba(255,255,255,.24);
    --panel: rgba(255,255,255,.12);
    --panel-2: rgba(255,255,255,.18);
  }
  .slide.theme-yellow {
    background: var(--yellow);
    color: var(--ink);
    --muted: rgba(9,11,15,.68);
    --faint: rgba(9,11,15,.22);
    --panel: rgba(255,255,255,.26);
    --panel-2: rgba(255,255,255,.38);
    --accent: var(--ink);
    --accent-on: var(--yellow);
  }

  .chrome {
    position: relative;
    z-index: 2;
    height: 30px;
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 24px;
    align-items: start;
    color: var(--muted);
    font: 760 12px/1.2 var(--mono);
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .stage {
    position: relative;
    z-index: 1;
    height: calc(100vh - (var(--pad-y) * 2) - 30px - var(--nav-safe));
    margin-top: 28px;
    display: grid;
    align-content: stretch;
    gap: 22px;
  }
  .grid-12 {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 22px;
    min-height: 0;
  }
  .span-3 { grid-column: span 3; }
  .span-4 { grid-column: span 4; }
  .span-5 { grid-column: span 5; }
  .span-6 { grid-column: span 6; }
  .span-7 { grid-column: span 7; }
  .span-8 { grid-column: span 8; }
  .span-9 { grid-column: span 9; }
  .span-12 { grid-column: span 12; }

  .stack { display: grid; gap: 16px; align-content: start; }
  .stack-lg { display: grid; gap: 24px; align-content: start; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bleed { margin: calc(var(--pad-y) * -1) calc(var(--pad-x) * -1); padding: var(--pad-y) var(--pad-x); min-height: 100vh; }

  .kicker {
    color: var(--accent);
    font: 820 12px/1.15 var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .theme-dark .kicker,
  .theme-accent .kicker,
  .theme-yellow .kicker { color: currentColor; opacity: .78; }
  .display {
    max-width: 980px;
    font-size: 96px;
    line-height: .92;
    font-weight: 260;
    letter-spacing: 0;
    text-wrap: balance;
  }
  .statement {
    max-width: 1060px;
    font-size: 86px;
    line-height: .96;
    font-weight: 260;
    letter-spacing: 0;
    text-wrap: balance;
  }
  .title {
    max-width: 780px;
    font-size: 58px;
    line-height: 1;
    font-weight: 320;
    letter-spacing: 0;
    text-wrap: balance;
  }
  .title-wide { max-width: 1080px; }
  .lead {
    max-width: 780px;
    color: var(--muted);
    font-size: 25px;
    line-height: 1.32;
    font-weight: 430;
  }
  .body {
    color: var(--muted);
    font-size: 21px;
    line-height: 1.42;
    font-weight: 440;
  }
  .body-sm {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.45;
    font-weight: 540;
  }
  .meta,
  .label {
    color: var(--muted);
    font: 780 12px/1.35 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .rule { height: 1px; background: var(--faint); }

  .panel {
    min-height: 126px;
    padding: 24px;
    border: 1px solid var(--faint);
    background: var(--panel);
  }
  .panel-2 {
    background: var(--panel-2);
  }
  .panel-ink {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    --muted: rgba(247,247,241,.72);
  }
  .panel-accent {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-on);
    --muted: rgba(255,255,255,.78);
  }
  .theme-yellow .panel-accent {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--yellow);
    --muted: rgba(232,239,56,.72);
  }
  .metric {
    font-size: 92px;
    line-height: .86;
    font-weight: 260;
    letter-spacing: 0;
  }
  .metric-xl {
    font-size: 156px;
    line-height: .82;
    font-weight: 240;
    letter-spacing: 0;
  }
  .metric-sm {
    font-size: 46px;
    line-height: .95;
    font-weight: 300;
    letter-spacing: 0;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 7px 10px;
    border: 1px solid var(--faint);
    color: var(--muted);
    font: 800 11px/1 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .frame {
    width: 100%;
    overflow: hidden;
    border: 1px solid var(--faint);
    background: var(--panel);
  }
  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .fit-contain img { object-fit: contain; }
  .r-21x9 { aspect-ratio: 21 / 9; }
  .r-16x9 { aspect-ratio: 16 / 9; }
  .r-16x10 { aspect-ratio: 16 / 10; }
  .h-full { height: 100%; min-height: 0; }

  .dot-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .28;
    background-image: radial-gradient(currentColor 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--muted);
  }
  .axis {
    position: absolute;
    inset: auto var(--pad-x) 82px var(--pad-x);
    height: 1px;
    background: var(--faint);
  }
  .cover-mark {
    position: absolute;
    right: var(--pad-x);
    bottom: 88px;
    width: 210px;
    height: 210px;
    border: 1px solid currentColor;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    opacity: .9;
  }
  .cover-mark span { border-left: 1px solid currentColor; border-top: 1px solid currentColor; }
  .cover-mark span:nth-child(3n+1) { border-left: 0; }
  .cover-mark span:nth-child(-n+3) { border-top: 0; }

  .timeline {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 1px;
    border: 1px solid var(--faint);
    background: var(--faint);
  }
  .timeline > div {
    min-height: 238px;
    padding: 24px;
    background: var(--paper);
    color: var(--ink);
    display: grid;
    align-content: space-between;
    gap: 34px;
  }
  .theme-dark .timeline > div,
  .theme-accent .timeline > div {
    background: rgba(255,255,255,.08);
    color: currentColor;
  }
  .compare {
    display: grid;
    grid-template-columns: minmax(0,1fr) 1px minmax(0,1fr);
    gap: 32px;
    align-items: stretch;
  }
  .divider { background: var(--faint); }
  .diagram {
    min-height: 380px;
    border: 1px solid var(--faint);
    background: var(--faint);
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 1px;
  }
  .diagram > div {
    background: var(--panel);
    padding: 28px;
    display: grid;
    align-content: center;
    gap: 18px;
  }
  .bar-chart {
    display: grid;
    gap: 14px;
    align-content: center;
    min-height: 360px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 160px minmax(0,1fr) 72px;
    gap: 18px;
    align-items: center;
    min-height: 48px;
  }
  .bar-track {
    height: 18px;
    background: var(--panel-2);
    border: 1px solid var(--faint);
  }
  .bar-fill {
    display: block;
    height: 100%;
    width: var(--w);
    background: var(--accent);
  }
  .matrix {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 1px;
    background: var(--faint);
    border: 1px solid var(--faint);
  }
  .matrix-cell {
    min-height: 130px;
    padding: 18px;
    background: var(--panel);
    display: grid;
    align-content: space-between;
    gap: 18px;
  }
  .matrix-cell.is-accent {
    background: var(--accent);
    color: var(--accent-on);
    --muted: rgba(255,255,255,.78);
  }
  .matrix .is-accent {
    border-color: var(--accent);
  }
  .ledger {
    display: grid;
    border-top: 1px solid var(--faint);
  }
  .ledger-row {
    display: grid;
    grid-template-columns: 190px minmax(0,1fr) 220px;
    gap: 22px;
    align-items: center;
    min-height: 96px;
    border-bottom: 1px solid var(--faint);
  }
  .quote {
    max-width: 1040px;
    font-size: 82px;
    line-height: 1;
    font-weight: 260;
    letter-spacing: 0;
    text-wrap: balance;
  }
  .image-hero {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 22px;
    min-height: 0;
  }

  .progress {
    position: fixed;
    left: 0;
    bottom: 0;
    z-index: 5;
    width: 0;
    height: 4px;
    background: var(--accent);
    transition: width 240ms ease;
  }
  .nav {
    position: fixed;
    right: 22px;
    bottom: 18px;
    z-index: 6;
    color: var(--muted);
    font: 800 12px/1 var(--mono);
  }
  .sr-status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .index {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    overflow: auto;
    padding: 5vh 5vw;
    background: rgba(247,247,241,.98);
    color: var(--ink);
  }
  .index.open { display: block; }
  .index-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 12px;
  }
  .index button {
    min-height: 104px;
    padding: 16px;
    border: 1px solid var(--faint);
    background: transparent;
    color: var(--ink);
    text-align: left;
    font: 760 13px/1.3 var(--sans);
    cursor: pointer;
  }

  @media (max-width: 1100px) {
    :root { --pad-x: 44px; --pad-y: 36px; }
    .display { font-size: 76px; }
    .statement { font-size: 68px; }
    .title { font-size: 48px; }
    .quote { font-size: 62px; }
    .metric { font-size: 72px; }
    .metric-xl { font-size: 118px; }
    .lead { font-size: 22px; }
    .body { font-size: 19px; }
  }
  @media (max-width: 760px) {
    :root { --pad-x: 20px; --pad-y: 26px; --nav-safe: 54px; }
    html, body { overflow: hidden; }
    .slide { overflow-x: hidden; overflow-y: auto; }
    .stage { height: auto; min-height: calc(100vh - 140px); }
    .grid-12,
    .timeline,
    .compare,
    .diagram {
      display: grid;
      grid-template-columns: 1fr;
    }
    .grid-12 > *,
    .span-3,
    .span-4,
    .span-5,
    .span-6,
    .span-7,
    .span-8,
    .span-9,
    .span-12 { grid-column: auto; }
    .divider { min-height: 1px; }
    .display { font-size: 43px; }
    .statement { font-size: 40px; }
    .title { font-size: 34px; }
    .quote { font-size: 36px; }
    .metric { font-size: 48px; }
    .metric-xl { font-size: 76px; }
    .lead { font-size: 19px; }
    .body { font-size: 17px; }
    .body-sm { font-size: 15px; }
    .panel { padding: 18px; }
    .timeline > div { min-height: 150px; }
    .ledger-row { grid-template-columns: 1fr; gap: 8px; padding: 18px 0; }
    .bar-row { grid-template-columns: 1fr; gap: 8px; }
    .matrix { grid-template-columns: 1fr; }
    .cover-mark { display: none; }
  }
</style>
</head>
<body>
<main class="deck" id="deck">
<!-- SLIDES_HERE -->
</main>
<div class="progress" id="progress"></div>
<div class="nav" id="nav" aria-live="polite" aria-atomic="true">1 / 1</div>
<div class="sr-status" id="slideStatus" role="status" aria-live="polite" aria-atomic="true"></div>
<aside class="index" id="index" aria-label="Slide index"><div class="index-grid" id="indexGrid"></div></aside>
<script>
(() => {
  const deck = document.getElementById('deck');
  const slides = Array.from(document.querySelectorAll('.slide'));
  const nav = document.getElementById('nav');
  const progress = document.getElementById('progress');
  const index = document.getElementById('index');
  const indexGrid = document.getElementById('indexGrid');
  const slideStatus = document.getElementById('slideStatus');
  let current = 0;
  const indexButtons = [];
  slides.forEach((slide, i) => {
    if (!slide.id) slide.id = `slide-${i + 1}`;
    slide.setAttribute('tabindex', '-1');
  });
  function titleFor(slide, i) {
    if (!slide) return `Slide ${i + 1}`;
    const heading = slide.querySelector('h1,h2,.title,.display,.statement,.quote');
    return heading && heading.textContent ? heading.textContent.trim().replace(/\s+/g, ' ').slice(0, 90) : `Slide ${i + 1}`;
  }
  function focusCurrentSlide() {
    try {
      slides[current].focus({ preventScroll: true });
    } catch (error) {
      slides[current].focus();
    }
  }
  function isEditableTarget(target) {
    return target && (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName));
  }
  function isAtScrollEnd(slide) {
    return slide.scrollTop + slide.clientHeight >= slide.scrollHeight - 2;
  }
  function isAtScrollStart(slide) {
    return slide.scrollTop <= 2;
  }
  function renderIndex() {
    indexGrid.innerHTML = '';
    indexButtons.length = 0;
    slides.forEach((slide, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `${String(i + 1).padStart(2, '0')} / ${titleFor(slide, i)}`;
      button.setAttribute('aria-controls', slide.id);
      button.addEventListener('click', () => {
        index.classList.remove('open');
        go(i, true);
      });
      indexGrid.appendChild(button);
      indexButtons.push(button);
    });
  }
  if (!slides.length) return;
  function go(next, focusSlide = false) {
    current = Math.max(0, Math.min(slides.length - 1, next));
    deck.style.transform = `translateX(${-current * 100}vw)`;
    nav.textContent = `${current + 1} / ${slides.length}`;
    progress.style.width = slides.length <= 1 ? '100%' : `${(current / (slides.length - 1)) * 100}%`;
    slideStatus.textContent = `${current + 1} of ${slides.length}: ${titleFor(slides[current], current)}`;
    indexButtons.forEach((button, i) => button.setAttribute('aria-current', i === current ? 'true' : 'false'));
    if (focusSlide) focusCurrentSlide();
  }
  document.addEventListener('keydown', (event) => {
    if (isEditableTarget(event.target)) return;
    if (event.key === 'Escape') {
      index.classList.toggle('open');
      if (!index.classList.contains('open')) focusCurrentSlide();
    }
    if (event.key === 'ArrowRight' || event.key === 'PageDown') {
      event.preventDefault();
      go(current + 1, true);
    }
    if (event.key === ' ') {
      if (isAtScrollEnd(slides[current])) {
        event.preventDefault();
        go(current + 1, true);
      }
    }
    if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
      event.preventDefault();
      go(current - 1, true);
    }
    if (event.key === 'Home') {
      event.preventDefault();
      go(0, true);
    }
    if (event.key === 'End') {
      event.preventDefault();
      go(slides.length - 1, true);
    }
  });
  document.addEventListener('wheel', (event) => {
    if (Math.abs(event.deltaX) < 24 && Math.abs(event.deltaY) < 36) return;
    const horizontalIntent = Math.abs(event.deltaX) > Math.abs(event.deltaY);
    if (!horizontalIntent && event.deltaY > 0 && !isAtScrollEnd(slides[current])) return;
    if (!horizontalIntent && event.deltaY < 0 && !isAtScrollStart(slides[current])) return;
    event.preventDefault();
    const direction = horizontalIntent ? event.deltaX : event.deltaY;
    go(current + (direction > 0 ? 1 : -1));
  }, { passive: false });
  let touchStart = null;
  document.addEventListener('touchstart', (event) => {
    touchStart = {
      x: event.touches[0].clientX,
      y: event.touches[0].clientY,
    };
  }, { passive: true });
  document.addEventListener('touchend', (event) => {
    if (touchStart === null) return;
    const deltaX = event.changedTouches[0].clientX - touchStart.x;
    const deltaY = event.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
      go(current + (deltaX < 0 ? 1 : -1));
    }
    touchStart = null;
  }, { passive: true });
  renderIndex();
  go(0);
})();
</script>
</body>
</html>
