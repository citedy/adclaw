<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Replace with deck title</title>
<style>
  :root {
    --paper: #fbfbf8;
    --ink: #080808;
    --muted: #6d6d68;
    --line: #d9d9d2;
    --panel: #f0f0eb;
    --accent: #0647ff;
    --accent-text: #0647ff;
    --accent-on: #ffffff;
    --sans: "Aptos", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --display-font: var(--sans);
    --text-font: var(--sans);
    --label-font: var(--mono);
    --display-tracking: -.075em;
    --title-tracking: -.065em;
    --metric-tracking: -.07em;
    --label-tracking: .16em;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
  body { font-family: var(--text-font); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
  .deck { width: 100vw; height: 100vh; display: flex; transition: transform .45s cubic-bezier(.22,.61,.36,1); }
  .slide { width: 100vw; height: 100vh; flex: 0 0 100vw; padding: 5vh 5vw; background: var(--paper); position: relative; overflow: hidden; }
  .slide.dark { background: var(--ink); color: var(--paper); }
  .slide.accent { background: var(--accent); color: var(--accent-on); }
  .chrome { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; font: 700 11px/1 var(--label-font); text-transform: uppercase; letter-spacing: var(--label-tracking); color: var(--muted); margin-bottom: 4vh; }
  .dark .chrome, .accent .chrome { color: rgba(255,255,255,.62); }
  .rule { height: 1px; background: currentColor; opacity: .2; }
  h1, h2, h3, p { margin: 0; }
  .display { font-family: var(--display-font); font-size: clamp(56px, 9vw, 138px); line-height: .86; letter-spacing: var(--display-tracking); font-weight: 800; max-width: 10ch; text-wrap: balance; }
  .title { font-family: var(--display-font); font-size: clamp(38px, 6vw, 90px); line-height: .9; letter-spacing: var(--title-tracking); font-weight: 760; max-width: 12ch; text-wrap: balance; }
  .lead { font-size: clamp(18px, 2vw, 30px); line-height: 1.22; max-width: 34ch; color: var(--muted); margin-top: 3vh; }
  .dark .lead, .accent .lead { color: rgba(255,255,255,.68); }
  .grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; height: calc(100% - 7vh); }
  .span-4 { grid-column: span 4; }
  .span-5 { grid-column: span 5; }
  .span-6 { grid-column: span 6; }
  .span-7 { grid-column: span 7; }
  .span-8 { grid-column: span 8; }
  .span-12 { grid-column: span 12; }
  .panel { background: var(--panel); padding: 24px; border: 1px solid var(--line); min-height: 140px; }
  .dark .panel { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
  .panel.accent { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
  .eyebrow { font: 800 11px/1 var(--label-font); letter-spacing: var(--label-tracking); text-transform: uppercase; color: var(--accent-text); margin-bottom: 18px; }
  .dark .eyebrow, .accent .eyebrow { color: currentColor; }
  .metric { font-family: var(--display-font); font-size: clamp(54px, 8vw, 120px); line-height: .82; letter-spacing: var(--metric-tracking); font-weight: 820; }
  .label { font: 700 12px/1.3 var(--label-font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 16px; }
  .body { font-size: clamp(18px, 1.65vw, 26px); line-height: 1.32; color: var(--muted); }
  .dark .body { color: rgba(255,255,255,.68); }
  .frame { width: 100%; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
  .r-21x9 { aspect-ratio: 21 / 9; }
  .r-16x10 { aspect-ratio: 16 / 10; }
  .r-16x9 { aspect-ratio: 16 / 9; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fit-contain img { object-fit: contain; }
  .timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .timeline > div { background: var(--paper); padding: 22px; min-height: 190px; }
  .timeline strong { display: block; font-size: 28px; margin-bottom: 48px; }
  .progress { position: fixed; left: 0; bottom: 0; height: 4px; background: var(--accent); width: 0; z-index: 5; transition: width .3s ease; }
  .nav { position: fixed; right: 22px; bottom: 18px; z-index: 6; font: 700 12px/1 var(--label-font); color: var(--muted); }
  .sr-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .index { position: fixed; inset: 0; z-index: 10; background: rgba(251,251,248,.97); color: var(--ink); display: none; overflow: auto; padding: 5vh 5vw; }
  .index.open { display: block; }
  .index-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .index button { min-height: 105px; text-align: left; border: 1px solid var(--line); background: transparent; padding: 16px; font: 700 13px/1.3 var(--text-font); cursor: pointer; }
  @media (max-width: 820px) {
    .slide { padding: 4vh 5vw; }
    .grid-12 { display: block; height: auto; overflow: auto; }
    .grid-12 > * { margin-bottom: 16px; }
    .timeline { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="deck" id="deck">
<!-- SLIDES_HERE -->
</main>
<div class="progress" id="progress"></div>
<div class="nav" id="nav" aria-live="polite" aria-atomic="true">1 / 1</div>
<div class="sr-status" id="slideStatus" role="status" aria-live="polite" aria-atomic="true"></div>
<aside class="index" id="index" aria-label="Slide index"><div class="index-grid" id="indexGrid"></div></aside>
<script>
(() => {
  const deck = document.getElementById('deck');
  const slides = Array.from(document.querySelectorAll('.slide'));
  const nav = document.getElementById('nav');
  const progress = document.getElementById('progress');
  const index = document.getElementById('index');
  const indexGrid = document.getElementById('indexGrid');
  const slideStatus = document.getElementById('slideStatus');
  let current = 0;
  const indexButtons = [];
  slides.forEach((slide, i) => {
    if (!slide.id) slide.id = `slide-${i + 1}`;
    slide.setAttribute('tabindex', '-1');
  });
  function titleFor(slide, i) {
    const heading = slide.querySelector('h1,h2,.title,.display');
    return heading && heading.textContent ? heading.textContent.trim().slice(0, 90) : `Slide ${i + 1}`;
  }
  function focusCurrentSlide() {
    try {
      slides[current].focus({ preventScroll: true });
    } catch (error) {
      slides[current].focus();
    }
  }
  function isEditableTarget(target) {
    return target && (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName));
  }
  function isAtScrollEnd(slide) {
    return slide.scrollTop + slide.clientHeight >= slide.scrollHeight - 1;
  }
  function renderIndex() {
    indexGrid.innerHTML = '';
    indexButtons.length = 0;
    slides.forEach((slide, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `${String(i + 1).padStart(2, '0')} / ${titleFor(slide, i)}`;
      button.setAttribute('aria-controls', slide.id);
      button.addEventListener('click', () => { index.classList.remove('open'); go(i, true); });
      indexGrid.appendChild(button);
      indexButtons.push(button);
    });
  }
  function go(next, focusSlide = false) {
    current = Math.max(0, Math.min(slides.length - 1, next));
    deck.style.transform = `translateX(${-current * 100}vw)`;
    nav.textContent = `${current + 1} / ${slides.length}`;
    progress.style.width = slides.length <= 1 ? '100%' : `${(current / (slides.length - 1)) * 100}%`;
    slideStatus.textContent = `${current + 1} of ${slides.length}: ${titleFor(slides[current], current)}`;
    indexButtons.forEach((button, i) => button.setAttribute('aria-current', i === current ? 'true' : 'false'));
    if (focusSlide) focusCurrentSlide();
  }
  document.addEventListener('keydown', (event) => {
    if (isEditableTarget(event.target)) return;
    if (event.key === 'Escape') {
      index.classList.toggle('open');
      if (!index.classList.contains('open')) focusCurrentSlide();
    }
    if (event.key === 'ArrowRight' || event.key === 'PageDown') {
      event.preventDefault();
      go(current + 1, true);
    }
    if (event.key === ' ') {
      if (isAtScrollEnd(slides[current])) {
        event.preventDefault();
        go(current + 1, true);
      }
    }
    if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
      event.preventDefault();
      go(current - 1, true);
    }
    if (event.key === 'Home') {
      event.preventDefault();
      go(0, true);
    }
    if (event.key === 'End') {
      event.preventDefault();
      go(slides.length - 1, true);
    }
  });
  let touchStart = null;
  document.addEventListener('touchstart', (event) => { touchStart = event.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', (event) => {
    if (touchStart === null) return;
    const delta = event.changedTouches[0].clientX - touchStart;
    if (Math.abs(delta) > 45) go(current + (delta < 0 ? 1 : -1));
    touchStart = null;
  }, { passive: true });
  renderIndex();
  go(0);
})();
</script>
</body>
</html>
