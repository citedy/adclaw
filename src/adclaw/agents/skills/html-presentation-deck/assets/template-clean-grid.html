<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Replace with deck title</title>
<style>
  :root {
    --paper: #fbfbf8;
    --ink: #080808;
    --muted: #6d6d68;
    --line: #d9d9d2;
    --panel: #f0f0eb;
    --accent: #0647ff;
    --accent-on: #ffffff;
    --sans: "Aptos", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .deck { width: 100vw; height: 100vh; display: flex; transition: transform .45s cubic-bezier(.22,.61,.36,1); }
  .slide { width: 100vw; height: 100vh; flex: 0 0 100vw; padding: 5vh 5vw; background: var(--paper); position: relative; overflow: hidden; }
  .slide.dark { background: var(--ink); color: var(--paper); }
  .slide.accent { background: var(--accent); color: var(--accent-on); }
  .chrome { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin-bottom: 4vh; }
  .dark .chrome, .accent .chrome { color: rgba(255,255,255,.62); }
  .rule { height: 1px; background: currentColor; opacity: .2; }
  h1, h2, h3, p { margin: 0; }
  .display { font-size: clamp(56px, 9vw, 138px); line-height: .86; letter-spacing: -.075em; font-weight: 800; max-width: 10ch; }
  .title { font-size: clamp(38px, 6vw, 90px); line-height: .9; letter-spacing: -.065em; font-weight: 760; max-width: 12ch; }
  .lead { font-size: clamp(18px, 2vw, 30px); line-height: 1.22; max-width: 34ch; color: var(--muted); margin-top: 3vh; }
  .dark .lead, .accent .lead { color: rgba(255,255,255,.68); }
  .grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; height: calc(100% - 7vh); }
  .span-4 { grid-column: span 4; }
  .span-5 { grid-column: span 5; }
  .span-6 { grid-column: span 6; }
  .span-7 { grid-column: span 7; }
  .span-8 { grid-column: span 8; }
  .span-12 { grid-column: span 12; }
  .panel { background: var(--panel); padding: 24px; border: 1px solid var(--line); min-height: 140px; }
  .dark .panel { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
  .panel.accent { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
  .eyebrow { font: 800 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
  .metric { font-size: clamp(54px, 8vw, 120px); line-height: .82; letter-spacing: -.07em; font-weight: 820; }
  .label { font: 700 12px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 16px; }
  .body { font-size: clamp(18px, 1.65vw, 26px); line-height: 1.32; color: var(--muted); }
  .dark .body { color: rgba(255,255,255,.68); }
  .frame { width: 100%; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
  .r-21x9 { aspect-ratio: 21 / 9; }
  .r-16x10 { aspect-ratio: 16 / 10; }
  .r-16x9 { aspect-ratio: 16 / 9; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fit-contain img { object-fit: contain; }
  .timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .timeline > div { background: var(--paper); padding: 22px; min-height: 190px; }
  .timeline strong { display: block; font-size: 28px; margin-bottom: 48px; }
  .progress { position: fixed; left: 0; bottom: 0; height: 4px; background: var(--accent); width: 0; z-index: 5; transition: width .3s ease; }
  .nav { position: fixed; right: 22px; bottom: 18px; z-index: 6; font: 700 12px/1 var(--mono); color: var(--muted); }
  .index { position: fixed; inset: 0; z-index: 10; background: rgba(251,251,248,.97); color: var(--ink); display: none; overflow: auto; padding: 5vh 5vw; }
  .index.open { display: block; }
  .index-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .index button { min-height: 105px; text-align: left; border: 1px solid var(--line); background: transparent; padding: 16px; font: 700 13px/1.3 var(--sans); cursor: pointer; }
  @media (max-width: 820px) {
    .slide { padding: 4vh 5vw; }
    .grid-12 { display: block; height: auto; overflow: auto; }
    .grid-12 > * { margin-bottom: 16px; }
    .timeline { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="deck" id="deck">
<!-- SLIDES_HERE -->
</main>
<div class="progress" id="progress"></div>
<div class="nav" id="nav">1 / 1</div>
<aside class="index" id="index" aria-label="Slide index"><div class="index-grid" id="indexGrid"></div></aside>
<script>
(() => {
  const deck = document.getElementById('deck');
  const slides = Array.from(document.querySelectorAll('.slide'));
  const nav = document.getElementById('nav');
  const progress = document.getElementById('progress');
  const index = document.getElementById('index');
  const indexGrid = document.getElementById('indexGrid');
  let current = 0;
  const titleFor = (slide, i) => (slide.querySelector('h1,h2,.title,.display')?.textContent || `Slide ${i + 1}`).trim().slice(0, 90);
  function renderIndex() {
    indexGrid.innerHTML = '';
    slides.forEach((slide, i) => {
      const button = document.createElement('button');
      button.textContent = `${String(i + 1).padStart(2, '0')} / ${titleFor(slide, i)}`;
      button.addEventListener('click', () => { index.classList.remove('open'); go(i); });
      indexGrid.appendChild(button);
    });
  }
  function go(next) {
    current = Math.max(0, Math.min(slides.length - 1, next));
    deck.style.transform = `translateX(${-current * 100}vw)`;
    nav.textContent = `${current + 1} / ${slides.length}`;
    progress.style.width = slides.length <= 1 ? '100%' : `${(current / (slides.length - 1)) * 100}%`;
  }
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') index.classList.toggle('open');
    if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') go(current + 1);
    if (event.key === 'ArrowLeft' || event.key === 'PageUp') go(current - 1);
    if (event.key === 'Home') go(0);
    if (event.key === 'End') go(slides.length - 1);
  });
  let touchStart = null;
  document.addEventListener('touchstart', (event) => { touchStart = event.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', (event) => {
    if (touchStart === null) return;
    const delta = event.changedTouches[0].clientX - touchStart;
    if (Math.abs(delta) > 45) go(current + (delta < 0 ? 1 : -1));
    touchStart = null;
  }, { passive: true });
  renderIndex();
  go(0);
})();
</script>
</body>
</html>
