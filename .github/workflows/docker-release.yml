# Build AdClaw Docker images (core/browser/full) and push to Docker Hub on release.
#
# Tags pushed per release:
#   - <version>-full, <version>-browser, <version>-core  (e.g. 1.0.0-full)
#   - full, browser, core                                (moving tags)
#   - latest                                             (points to full, for DO Marketplace compat)
#
# For DO Marketplace backwards compatibility, `latest` tracks the `full` variant.
name: Docker Build and Push

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. v1.0.0)"
        required: true
        type: string

env:
  IMAGE: nttylock/adclaw

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dockerfile picks extras based on ADCLAW_VARIANT:
        #   core    → [local]
        #   browser → [browser,local]
        #   full    → [all,local]
        variant: [full, browser, core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute variant tags
        id: tags
        run: |
          VER="${{ steps.version.outputs.tag }}"
          VARIANT="${{ matrix.variant }}"
          # Strip leading 'v' from tag (e.g. v1.0.0 → 1.0.0)
          VER_CLEAN="${VER#v}"
          TAGS="docker.io/${{ env.IMAGE }}:${VER_CLEAN}-${VARIANT}"
          TAGS="${TAGS},docker.io/${{ env.IMAGE }}:${VARIANT}"
          # `latest` tracks `full` variant for DO Marketplace backwards compat
          if [ "$VARIANT" = "full" ]; then
            TAGS="${TAGS},docker.io/${{ env.IMAGE }}:${VER_CLEAN}"
            TAGS="${TAGS},docker.io/${{ env.IMAGE }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Build and push ${{ matrix.variant }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            ADCLAW_VARIANT=${{ matrix.variant }}
            ADCLAW_ENABLED_CHANNELS=discord,dingtalk,feishu,qq,console,telegram
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  promote-cloudflare:
    name: Dispatch Cloudflare promotion
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version tag
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            tag="${{ inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "clean=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable Docker digests
        id: digests
        env:
          VERSION: ${{ steps.version.outputs.clean }}
        run: |
          set -euo pipefail
          resolve_digest() {
            local image="$1"
            docker buildx imagetools inspect "${image}" | awk '/^Digest:/ {print $2; exit}'
          }

          core_digest="$(resolve_digest "docker.io/${{ env.IMAGE }}:${VERSION}-core")"
          browser_digest="$(resolve_digest "docker.io/${{ env.IMAGE }}:${VERSION}-browser")"
          full_digest="$(resolve_digest "docker.io/${{ env.IMAGE }}:${VERSION}-full")"

          for value in "${core_digest}" "${browser_digest}" "${full_digest}"; do
            if [[ ! "${value}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Resolved invalid digest: ${value}"
              exit 1
            fi
          done

          echo "core=${core_digest}" >> "$GITHUB_OUTPUT"
          echo "browser=${browser_digest}" >> "$GITHUB_OUTPUT"
          echo "full=${full_digest}" >> "$GITHUB_OUTPUT"

      - name: Dispatch adclaw-cf promotion
        env:
          GH_TOKEN: ${{ secrets.ADCLAW_CF_PROMOTION_TOKEN }}
          VERSION: ${{ steps.version.outputs.clean }}
          CORE_DIGEST: ${{ steps.digests.outputs.core }}
          BROWSER_DIGEST: ${{ steps.digests.outputs.browser }}
          FULL_DIGEST: ${{ steps.digests.outputs.full }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Missing ADCLAW_CF_PROMOTION_TOKEN secret"
            exit 1
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nttylock/adclaw-cf/dispatches \
            -d @- <<JSON
          {
            "event_type": "adclaw_release_published",
            "client_payload": {
              "version": "${VERSION}",
              "source_repo": "${GITHUB_REPOSITORY}",
              "source_sha": "${GITHUB_SHA}",
              "core_digest": "${CORE_DIGEST}",
              "browser_digest": "${BROWSER_DIGEST}",
              "full_digest": "${FULL_DIGEST}"
            }
          }
          JSON
