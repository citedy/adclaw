# Dispatch a Cloudflare promotion after Docker images are published.
#
# This intentionally lives outside docker-release.yml. Docker publishing must
# stay green if the downstream Cloudflare promotion signal is delayed or broken.
name: Dispatch Cloudflare Promotion

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Published AdClaw version, for example v1.0.6 or 1.0.6"
        required: true
        type: string

env:
  IMAGE: nttylock/adclaw
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    name: Dispatch adclaw-cf promotion
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'release'
      )
    permissions:
      contents: read

    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "${version}" ]]; then
            version="${RUN_HEAD_BRANCH:-}"
          fi
          if [[ -z "${version}" || ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            version="${RUN_DISPLAY_TITLE:-}"
          fi
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-zA-Z0-9_.+-]+)?$ ]]; then
            echo "::error::Could not resolve release version from workflow_run payload"
            exit 1
          fi
          echo "clean=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${RUN_HEAD_SHA:-${GITHUB_SHA}}" >> "${GITHUB_OUTPUT}"

      - name: Resolve immutable Docker digests
        id: digests
        env:
          VERSION: ${{ steps.version.outputs.clean }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          namespace = "nttylock"
          repo = "adclaw"
          version = os.environ["VERSION"]
          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          required_platforms = {("linux", "amd64"), ("linux", "arm64")}
          accept = ", ".join(
              [
                  "application/vnd.docker.distribution.manifest.list.v2+json",
                  "application/vnd.oci.image.index.v1+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
              ]
          )

          def read_json(url, headers=None):
              request = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response, json.loads(response.read().decode("utf-8"))

          token_url = "https://auth.docker.io/token?" + urllib.parse.urlencode(
              {
                  "service": "registry.docker.io",
                  "scope": f"repository:{namespace}/{repo}:pull",
              }
          )
          _, token_body = read_json(token_url)
          token = token_body["token"]

          def resolve_digest(tag):
              url = f"https://registry-1.docker.io/v2/{namespace}/{repo}/manifests/{tag}"
              response, manifest = read_json(
                  url,
                  {
                      "Accept": accept,
                      "Authorization": f"Bearer {token}",
                  },
              )
              digest = response.headers.get("Docker-Content-Digest", "")
              if not digest_pattern.fullmatch(digest):
                  raise SystemExit(f"Resolved invalid digest for {tag}: {digest!r}")

              platforms = {
                  (
                      item.get("platform", {}).get("os"),
                      item.get("platform", {}).get("architecture"),
                  )
                  for item in manifest.get("manifests", [])
              }
              if platforms and not required_platforms.issubset(platforms):
                  raise SystemExit(f"{tag} is missing required platforms: {sorted(platforms)}")
              return digest

          outputs = {
              "core": resolve_digest(f"{version}-core"),
              "browser": resolve_digest(f"{version}-browser"),
              "full": resolve_digest(f"{version}-full"),
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, digest in outputs.items():
                  print(f"{name}={digest}", file=output)
          PY

      - name: Dispatch adclaw-cf promotion
        env:
          GH_TOKEN: ${{ secrets.ADCLAW_CF_PROMOTION_TOKEN }}
          VERSION: ${{ steps.version.outputs.clean }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          CORE_DIGEST: ${{ steps.digests.outputs.core }}
          BROWSER_DIGEST: ${{ steps.digests.outputs.browser }}
          FULL_DIGEST: ${{ steps.digests.outputs.full }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Missing ADCLAW_CF_PROMOTION_TOKEN secret"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          payload = {
              "event_type": "adclaw_release_published",
              "client_payload": {
                  "version": os.environ["VERSION"],
                  "source_repo": os.environ["GITHUB_REPOSITORY"],
                  "source_sha": os.environ["SOURCE_SHA"],
                  "core_digest": os.environ["CORE_DIGEST"],
                  "browser_digest": os.environ["BROWSER_DIGEST"],
                  "full_digest": os.environ["FULL_DIGEST"],
              },
          }

          with open("payload.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nttylock/adclaw-cf/dispatches \
            -d @payload.json
