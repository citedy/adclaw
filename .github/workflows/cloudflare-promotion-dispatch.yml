# Dispatch a Cloudflare promotion after Docker images are published.
#
# This intentionally lives outside docker-release.yml. Docker publishing must
# stay green if the downstream Cloudflare promotion signal is delayed or broken.
name: Dispatch Cloudflare Promotion

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Published AdClaw version, for example v1.0.6 or 1.0.6"
        required: true
        type: string

env:
  IMAGE: nttylock/adclaw
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    name: Dispatch adclaw-cf promotion
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'release'
      )
    permissions:
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "${version}" ]]; then
            version="${RUN_HEAD_BRANCH:-}"
          fi
          if [[ -z "${version}" || ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            version="${RUN_DISPLAY_TITLE:-}"
          fi
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-zA-Z0-9_.+-]+)?$ ]]; then
            echo "::error::Could not resolve release version from workflow_run payload"
            exit 1
          fi
          echo "clean=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${RUN_HEAD_SHA:-${GITHUB_SHA}}" >> "${GITHUB_OUTPUT}"

      - name: Resolve immutable Docker digests
        id: digests
        env:
          VERSION: ${{ steps.version.outputs.clean }}
        run: |
          set -euo pipefail
          resolve_digest() {
            local image="$1"
            docker buildx imagetools inspect "${image}" | awk '/^Digest:/ {print $2; exit}'
          }

          core_digest="$(resolve_digest "docker.io/${IMAGE}:${VERSION}-core")"
          browser_digest="$(resolve_digest "docker.io/${IMAGE}:${VERSION}-browser")"
          full_digest="$(resolve_digest "docker.io/${IMAGE}:${VERSION}-full")"

          for value in "${core_digest}" "${browser_digest}" "${full_digest}"; do
            if [[ ! "${value}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Resolved invalid digest: ${value}"
              exit 1
            fi
          done

          echo "core=${core_digest}" >> "${GITHUB_OUTPUT}"
          echo "browser=${browser_digest}" >> "${GITHUB_OUTPUT}"
          echo "full=${full_digest}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch adclaw-cf promotion
        env:
          GH_TOKEN: ${{ secrets.ADCLAW_CF_PROMOTION_TOKEN }}
          VERSION: ${{ steps.version.outputs.clean }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          CORE_DIGEST: ${{ steps.digests.outputs.core }}
          BROWSER_DIGEST: ${{ steps.digests.outputs.browser }}
          FULL_DIGEST: ${{ steps.digests.outputs.full }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Missing ADCLAW_CF_PROMOTION_TOKEN secret"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          payload = {
              "event_type": "adclaw_release_published",
              "client_payload": {
                  "version": os.environ["VERSION"],
                  "source_repo": os.environ["GITHUB_REPOSITORY"],
                  "source_sha": os.environ["SOURCE_SHA"],
                  "core_digest": os.environ["CORE_DIGEST"],
                  "browser_digest": os.environ["BROWSER_DIGEST"],
                  "full_digest": os.environ["FULL_DIGEST"],
              },
          }

          with open("payload.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nttylock/adclaw-cf/dispatches \
            -d @payload.json
